<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skopos — engine room</title>
<style>
  :root{
    --bg:#0b0d11; --panel:#12161d; --panel2:#161b24; --line:#222a35;
    --fg:#e6ebf2; --dim:#8b95a5; --dimmer:#5f6a7a;
    --accent:#4aa8e0; --good:#3ddc97; --warn:#f2b544; --bad:#e0574a;
    --violet:#a48be0;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  header{display:flex;align-items:center;gap:12px;padding:9px 16px;
         border-bottom:1px solid var(--line);background:var(--panel);
         flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .logo{font-weight:700;letter-spacing:.14em;font-size:15px}
  .tag{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  .badge{font:11px/1 var(--mono);padding:5px 8px;border:1px solid var(--line);
         border-radius:4px;color:var(--dim);background:var(--panel2);white-space:nowrap}
  .badge b{color:var(--fg);font-weight:600}
  .badge.good{border-color:var(--good);color:var(--good)}
  .badge.bad{border-color:var(--bad);color:var(--bad)}
  button{font:11px/1 var(--mono);padding:6px 9px;border-radius:5px;cursor:pointer;
         background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
  button:hover{border-color:var(--accent);color:var(--accent)}

  main{padding:12px;display:grid;gap:12px;
       grid-template-columns:repeat(auto-fit,minmax(430px,1fr));align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;
         overflow:hidden;min-width:0}
  .panel.wide{grid-column:1/-1}
  .panel > h2{margin:0;padding:8px 12px;font:600 11px/1.35 var(--mono);
              letter-spacing:.10em;text-transform:uppercase;color:var(--dim);
              border-bottom:1px solid var(--line)}
  .panel > h2 .sub{font-weight:400;letter-spacing:0;text-transform:none;color:var(--dimmer)}
  .body{padding:10px 12px}
  canvas{display:block;width:100%}
  .note{font:10.5px/1.45 var(--mono);color:var(--dimmer);margin-top:7px}
  .note b{color:var(--dim);font-weight:600}
  .kv{display:flex;justify-content:space-between;font:11px/1.75 var(--mono);gap:10px}
  .kv span:first-child{color:var(--dim)}
  .kv b{overflow-wrap:anywhere;text-align:right}
  table{width:100%;border-collapse:collapse;font:11px/1.5 var(--mono)}
  td,th{padding:3px 5px;text-align:left;border-bottom:1px solid #1a2029}
  th{color:var(--dimmer);font-weight:400}
  td.r,th.r{text-align:right}
  tr.bad td{color:var(--bad)}
  .gated{color:var(--dimmer);font-style:italic}
  .grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font:10px/1 var(--mono);padding:4px 7px;border-radius:4px;
        border:1px solid var(--line);color:var(--dim);background:var(--panel2)}
  .empty{padding:40px 12px;text-align:center;color:var(--dimmer);font:12px var(--mono)}
  .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
        font:11px/1.4 var(--mono)}
  .node{border:1px solid var(--line);border-radius:6px;padding:7px 10px;
        background:var(--panel2);min-width:0}
  .node .n{color:var(--fg);font-weight:600}
  .node .l{color:var(--dimmer);font-size:10px}
  .arrow{color:var(--dimmer)}
  .node.hot{border-color:var(--bad)}
  .node.cool{border-color:var(--good)}
</style>
</head>
<body>

<header>
  <div class="logo">SKOPOS</div>
  <div class="tag">engine room — what the demo is actually doing</div>
  <div class="spacer"></div>
  <div class="badge" id="b-samples">—</div>
  <div class="badge" id="b-seed">—</div>
  <div class="badge" id="b-ready">—</div>
  <button id="btn-refresh">Refresh</button>
  <a class="badge" href="/">← back to the demo</a>
</header>

<main id="main">
  <div class="empty" id="loading">loading internals…</div>
</main>

<template id="tpl">
<div class="panel wide">
  <h2>pipeline <span class="sub">— where the compute actually goes</span></h2>
  <div class="body">
    <div class="flow" id="flow"></div>
    <div class="note" id="flow-note"></div>
  </div>
</div>

<div class="panel">
  <h2>monte carlo <span class="sub">— severity of every sampled room</span></h2>
  <div class="body">
    <canvas id="c-sev" height="190"></canvas>
    <div class="note" id="n-sev"></div>
  </div>
</div>

<div class="panel">
  <h2>convergence <span class="sub">— the estimate earning its precision</span></h2>
  <div class="body">
    <canvas id="c-conv" height="190"></canvas>
    <div class="note" id="n-conv"></div>
  </div>
</div>

<div class="panel">
  <h2>perturbation space <span class="sub">— sampled, never enumerated</span></h2>
  <div class="body">
    <canvas id="c-scatter" height="230"></canvas>
    <div class="note" id="n-scatter"></div>
  </div>
</div>

<div class="panel">
  <h2>what drives failure <span class="sub">— measured, not asserted</span></h2>
  <div class="body">
    <div class="grid4">
      <canvas id="c-ax-lighting" height="110"></canvas>
      <canvas id="c-ax-clutter" height="110"></canvas>
      <canvas id="c-ax-max_disp" height="110"></canvas>
      <canvas id="c-ax-removed" height="110"></canvas>
    </div>
    <div class="note" id="n-axes"></div>
  </div>
</div>

<div class="panel wide">
  <h2>importance weighting <span class="sub">— one campaign, scored as three homes</span></h2>
  <div class="body">
    <div class="grid4" style="grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)">
      <div>
        <canvas id="c-logw" height="190"></canvas>
        <div class="note" id="n-logw"></div>
      </div>
      <div>
        <canvas id="c-ess" height="120"></canvas>
        <table id="t-weights"><tbody></tbody></table>
      </div>
    </div>
  </div>
</div>

<div class="panel wide">
  <h2>contextual bandit <span class="sub">— the linear model behind the bars</span></h2>
  <div class="body">
    <div class="chiprow" id="ctx-chips"></div>
    <div class="grid4" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <div>
        <canvas id="c-ucb" height="170"></canvas>
        <div class="note" id="n-ucb"></div>
      </div>
      <div>
        <canvas id="c-theta" height="170"></canvas>
        <div class="note" id="n-theta"></div>
      </div>
    </div>
    <canvas id="c-reward" height="90" style="margin-top:10px"></canvas>
    <div class="note" id="n-reward"></div>
  </div>
</div>

<div class="panel wide">
  <h2>adversarial search <span class="sub">— the sampler refitting to its own worst outcomes</span></h2>
  <div class="body" id="cem-body">
    <div class="grid4" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)">
      <div>
        <canvas id="c-cem" height="170"></canvas>
        <div class="note" id="n-cem"></div>
      </div>
      <div>
        <canvas id="c-cemparams" height="170"></canvas>
        <div class="note" id="n-cemparams"></div>
      </div>
    </div>
  </div>
</div>
</template>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const DPR = () => window.devicePixelRatio || 1;
let DATA = null;

const COL = {fg:"#e6ebf2", dim:"#8b95a5", dimmer:"#5f6a7a", line:"#222a35",
             accent:"#4aa8e0", good:"#3ddc97", warn:"#f2b544", bad:"#e0574a",
             violet:"#a48be0", panel:"#12161d"};
const SERIES = [COL.accent, COL.warn, COL.violet, COL.good];

// ---------------------------------------------------------------- canvas utils
function prep(c, h){
  const dpr = DPR();
  const w = c.clientWidth || 400;
  c.width = w * dpr; c.height = h * dpr;
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.font = "10px ui-monospace,monospace";
  return {ctx, w, h};
}
function axes(ctx, w, h, pad){
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, h - pad.b); ctx.lineTo(w - pad.r, h - pad.b);
  ctx.stroke();
}
function label(ctx, text, x, y, col){
  ctx.fillStyle = col || COL.dimmer; ctx.fillText(text, x, y);
}

// ------------------------------------------------------------------ pipeline
function drawFlow(d){
  const p = d.pipeline, mc = d.monte_carlo;
  const ratio = p.scored ? (100 * p.rendered / p.scored) : 0;
  const nodes = [
    {n: "1 scene graph", l: (d.scene ? d.scene.items.length : 0) + " objects, "
        + (p.payload_bytes/1024).toFixed(1) + " KB sent", cls: "cool"},
    {n: p.scored.toLocaleString() + " configurations", l: "sampled from the mixture proposal"},
    {n: p.scored.toLocaleString() + " surrogate calls", l: "scored on the graph, no pixels"},
    {n: (mc ? Math.round(mc.p_fail * p.scored).toLocaleString() : "—") + " failures",
     l: mc ? (100*mc.p_fail).toFixed(1) + "% of the campaign" : "", cls: "hot"},
    {n: p.rendered + " world-model calls", l: "elite only — " + ratio.toFixed(2) + "% of the campaign", cls: "cool"},
  ];
  $("flow").innerHTML = nodes.map((x, i) =>
    (i ? '<span class="arrow">▶</span>' : "") +
    '<div class="node ' + (x.cls||"") + '"><div class="n">' + x.n + '</div>'
    + '<div class="l">' + x.l + "</div></div>").join("");
  $("flow-note").innerHTML =
    "Rendering is the only expensive step, so it is the only one that is rationed. "
    + "<b>" + p.scored.toLocaleString() + " configurations scored, " + p.rendered
    + " rendered</b> — everything to the left of the last box is free. "
    + "Frames from the scan: " + p.frames_seen + " processed, " + p.frames_retained
    + " written to disk.";
}

// ----------------------------------------------------------------- histogram
function drawSeverity(mc){
  const {ctx, w, h} = prep($("c-sev"), 190);
  const pad = {l: 34, r: 10, t: 12, b: 26};
  const H = mc.severity_hist;
  if(!H.counts.length) return;
  const n = H.counts.length, maxc = H.max || 1;
  const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
  const bw = (x1 - x0) / n;
  const sx = (v) => x0 + (v - H.lo) / (H.hi - H.lo) * (x1 - x0);
  const sy = (c) => y0 - (c / maxc) * (y0 - y1);

  for(let i = 0; i < n; i++){
    const lo = H.edges[i], hi = H.edges[i+1];
    const fail = lo >= mc.threshold;
    ctx.fillStyle = fail ? "rgba(224,87,74,.72)" : "rgba(74,168,224,.62)";
    const y = sy(H.counts[i]);
    ctx.fillRect(x0 + i*bw, y, Math.max(bw - 1, 1), y0 - y);
  }
  // the engine's own failure threshold
  const tx = sx(mc.threshold);
  ctx.strokeStyle = COL.bad; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(tx, y1 - 4); ctx.lineTo(tx, y0); ctx.stroke();
  ctx.setLineDash([]);
  label(ctx, "FAIL_THRESHOLD = " + mc.threshold, tx + 5, y1 + 6, COL.bad);
  axes(ctx, w, h, pad);
  label(ctx, "0", x0 - 3, y0 + 13);
  label(ctx, mc.severity_max.toFixed(1), x1 - 16, y0 + 13);
  label(ctx, "severity →", (x0+x1)/2 - 22, y0 + 22);
  label(ctx, maxc.toLocaleString(), 2, y1 + 8);

  $("n-sev").innerHTML =
    "Every one of <b>" + mc.n.toLocaleString() + "</b> sampled rooms, scored by the "
    + "surrogate. Everything right of the dashed line counts as a failure: "
    + "<b>" + (100*mc.p_fail).toFixed(2) + "%</b> of the mass. The long tail past the "
    + "line is why a mean severity would be the wrong summary — it is a rate, not an average.";
}

// ---------------------------------------------------------------- convergence
function drawConvergence(mc){
  const {ctx, w, h} = prep($("c-conv"), 190);
  const pad = {l: 40, r: 10, t: 12, b: 26};
  const R = mc.running;
  if(R.length < 2) return;
  const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
  const maxN = R[R.length-1].n;
  let lo = 1, hi = 0;
  R.forEach(r => { lo = Math.min(lo, r.lo); hi = Math.max(hi, r.hi); });
  lo = Math.max(0, lo - 0.02); hi = Math.min(1, hi + 0.02);
  const sx = (n) => x0 + (n/maxN)*(x1-x0);
  const sy = (p) => y0 - ((p-lo)/(hi-lo))*(y0-y1);

  // 95% band
  ctx.fillStyle = "rgba(74,168,224,.16)";
  ctx.beginPath();
  R.forEach((r,i) => i ? ctx.lineTo(sx(r.n), sy(r.hi)) : ctx.moveTo(sx(r.n), sy(r.hi)));
  for(let i = R.length-1; i >= 0; i--) ctx.lineTo(sx(R[i].n), sy(R[i].lo));
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = COL.accent; ctx.lineWidth = 2;
  ctx.beginPath();
  R.forEach((r,i) => i ? ctx.lineTo(sx(r.n), sy(r.p)) : ctx.moveTo(sx(r.n), sy(r.p)));
  ctx.stroke();

  const fin = R[R.length-1];
  ctx.strokeStyle = COL.dimmer; ctx.setLineDash([3,3]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, sy(fin.p)); ctx.lineTo(x1, sy(fin.p)); ctx.stroke();
  ctx.setLineDash([]);
  axes(ctx, w, h, pad);
  label(ctx, (100*hi).toFixed(0) + "%", 2, y1 + 8);
  label(ctx, (100*lo).toFixed(0) + "%", 2, y0);
  label(ctx, "samples →", (x0+x1)/2 - 22, y0 + 22);
  label(ctx, maxN.toLocaleString(), x1 - 34, y0 + 13);

  const width = 100*(fin.hi - fin.lo);
  $("n-conv").innerHTML =
    "The plain Monte Carlo estimate of P(failure) as samples accumulate, with its "
    + "<b>95% binomial interval</b>. It lands at <b>" + (100*fin.p).toFixed(2) + "%</b> "
    + "± " + (width/2).toFixed(2) + " points. The band narrowing as 1/√n is the whole "
    + "argument for sampling rather than enumerating: precision is bought, and you can "
    + "see the price.";
}

// ------------------------------------------------------------------- scatter
function drawScatter(mc, scene){
  const {ctx, w, h} = prep($("c-scatter"), 230);
  const pad = {l: 30, r: 10, t: 10, b: 26};
  const pts = mc.scatter;
  if(!pts.length) return;
  let minx = 9e9, maxx = -9e9, miny = 9e9, maxy = -9e9;
  pts.forEach(p => { minx=Math.min(minx,p.x); maxx=Math.max(maxx,p.x);
                     miny=Math.min(miny,p.y); maxy=Math.max(maxy,p.y); });
  const sx = (v) => pad.l + (v-minx)/(maxx-minx||1)*(w-pad.l-pad.r);
  const sy = (v) => h-pad.b - (v-miny)/(maxy-miny||1)*(h-pad.b-pad.t);

  // the other objects in the room, for orientation
  (scene ? scene.items : []).forEach(it => {
    if(it.name === mc.scatter_of) return;
    ctx.strokeStyle = "rgba(139,149,165,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(sx(it.x), sy(it.y), 4, 0, 7); ctx.stroke();
    label(ctx, it.name.replace(/_/g," "), sx(it.x)+6, sy(it.y)+3, "rgba(139,149,165,.5)");
  });

  let nf = 0, ngone = 0;
  pts.forEach(p => {
    if(p.gone){ ngone++; return; }
    if(p.f) nf++;
    ctx.fillStyle = p.f ? "rgba(224,87,74,.55)" : "rgba(61,220,151,.42)";
    ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 2.1, 0, 7); ctx.fill();
  });
  axes(ctx, w, h, pad);
  label(ctx, "x (m) →", (w)/2 - 18, h - 4);
  label(ctx, minx.toFixed(1), pad.l - 4, h - pad.b + 13);
  label(ctx, maxx.toFixed(1), w - pad.r - 18, h - pad.b + 13);

  $("n-scatter").innerHTML =
    "Where the <b>" + mc.scatter_of + "</b> ended up across " + pts.length.toLocaleString()
    + " sampled rooms (every " + mc.scatter_stride + "th of " + mc.n.toLocaleString()
    + "). Red failed, green succeeded"
    + (ngone ? ", and <b>" + ngone + "</b> rooms had no " + mc.scatter_of + " at all so are not plotted" : "")
    + ". This is a continuous space: there is nothing to enumerate, only to sample.";
}

// -------------------------------------------------------------- axis effects
const AXIS_META = {
  lighting: {title: "lighting", note: "0 dark → 1 bright"},
  clutter:  {title: "unmodelled clutter", note: "objects not in the scan"},
  max_disp: {title: "largest object move (m)", note: ""},
  removed:  {title: "objects missing", note: ""},
};
function drawAxis(key, A){
  const c = $("c-ax-" + key);
  const {ctx, w, h} = prep(c, 110);
  const pad = {l: 26, r: 8, t: 16, b: 20};
  const pts = A.centres.map((x,i) => ({x, m: A.means[i], n: A.counts[i]}))
                       .filter(p => p.m !== null && p.n > 0);
  if(!pts.length) return;
  const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
  const sx = (v) => x0 + (v - A.lo)/((A.hi - A.lo)||1)*(x1-x0);
  const sy = (m) => y0 - m*(y0-y1);
  ctx.strokeStyle = COL.line;
  [0, 0.5, 1].forEach(g => { const y = sy(g);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); });
  ctx.strokeStyle = COL.bad; ctx.lineWidth = 2;
  ctx.beginPath();
  pts.forEach((p,i) => i ? ctx.lineTo(sx(p.x), sy(p.m)) : ctx.moveTo(sx(p.x), sy(p.m)));
  ctx.stroke();
  ctx.fillStyle = COL.bad;
  pts.forEach(p => { ctx.beginPath(); ctx.arc(sx(p.x), sy(p.m), 2, 0, 7); ctx.fill(); });
  axes(ctx, w, h, pad);
  label(ctx, AXIS_META[key].title, x0, y1 - 5, COL.dim);
  label(ctx, "100%", 1, y1 + 4); label(ctx, "0", 1, y0 + 3);
  label(ctx, A.lo.toFixed(A.hi > 5 ? 0 : 1), x0 - 2, y0 + 13);
  label(ctx, A.hi.toFixed(A.hi > 5 ? 0 : 1), x1 - 14, y0 + 13);
}
function drawAxesPanel(mc){
  Object.keys(AXIS_META).forEach(k => drawAxis(k, mc.axes[k]));
  const L = mc.axes.lighting;
  const dark = L.means.find(m => m !== null);
  const bright = [...L.means].reverse().find(m => m !== null);
  $("n-axes").innerHTML =
    "Failure rate against each perturbation axis, computed from the campaign's own "
    + "samples. The lighting panel is the finding: in the darkest rooms the task fails "
    + "<b>" + (dark !== undefined ? (100*dark).toFixed(0) : "—") + "%</b> of the time "
    + "against <b>" + (bright !== undefined ? (100*bright).toFixed(0) : "—") + "%</b> "
    + "in the brightest. That is why the adversarial search below converges on darkness "
    + "without being told to.";
}

// ------------------------------------------------------- importance weighting
function drawLogW(W){
  const {ctx, w, h} = prep($("c-logw"), 190);
  const pad = {l: 34, r: 10, t: 14, b: 26};
  const rows = W.rows;
  let lo = 9e9, hi = -9e9, maxc = 1;
  rows.forEach(r => { const H = r.logw_hist;
    lo = Math.min(lo, H.lo); hi = Math.max(hi, H.hi); maxc = Math.max(maxc, H.max); });
  const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
  const sx = (v) => x0 + (v-lo)/((hi-lo)||1)*(x1-x0);
  // log-scaled counts: the mode is thousands of samples and the tail is single
  // digits, and the tail is the half that matters for effective sample size.
  const sy = (c) => y0 - (Math.log1p(c)/Math.log1p(maxc))*(y0-y1);
  rows.forEach((r, k) => {
    const H = r.logw_hist;
    ctx.strokeStyle = SERIES[k % SERIES.length]; ctx.lineWidth = 1.8;
    ctx.beginPath();
    H.counts.forEach((c, i) => {
      const x = sx((H.edges[i] + H.edges[i+1]) / 2);
      i ? ctx.lineTo(x, sy(c)) : ctx.moveTo(x, sy(c));
    });
    ctx.stroke();
    label(ctx, r.name.replace(/_/g," "), x0 + 6 + k*105, y1 - 4, SERIES[k % SERIES.length]);
  });
  axes(ctx, w, h, pad);
  label(ctx, "log w = log p(θ) − log q(θ)  →", (x0+x1)/2 - 62, y0 + 22);
  label(ctx, "count (log)", 2, y1 + 8);
  label(ctx, lo.toFixed(1), x0 - 4, y0 + 13);
  label(ctx, hi.toFixed(1), x1 - 20, y0 + 13);

  const clipped = rows.reduce((a, r) => a + (r.logw_hist.clipped_below || 0), 0);
  $("n-logw").innerHTML =
    "The importance weight of every sample, per archetype, in logs. A <b>narrow</b> "
    + "distribution means the proposal covers that archetype well and the estimate rests "
    + "on all the samples; a long left tail means most samples were effectively thrown "
    + "away. The defensive mixture is what keeps these narrow. "
    + "Axis clipped at the 1st percentile — " + clipped.toLocaleString()
    + " samples across the three archetypes sit further left, down to log w "
    + Math.min.apply(null, rows.map(r => r.logw_hist.true_min)).toFixed(1) + ".";
}

function drawESS(W){
  const {ctx, w, h} = prep($("c-ess"), 120);
  const rows = W.rows, pad = {l: 90, r: 40, t: 12, b: 16};
  const maxE = Math.max(W.n, ...rows.map(r => r.ess));
  const x0 = pad.l, x1 = w - pad.r;
  const bh = Math.min(20, (h - pad.t - pad.b) / rows.length - 6);
  rows.forEach((r, i) => {
    const y = pad.t + i * (bh + 8);
    const bw = (r.ess / maxE) * (x1 - x0);
    ctx.fillStyle = r.reliable ? "rgba(61,220,151,.55)" : "rgba(224,87,74,.55)";
    ctx.fillRect(x0, y, Math.max(bw, 2), bh);
    label(ctx, r.name.replace(/_/g," "), 2, y + bh - 3, COL.dim);
    label(ctx, Math.round(r.ess).toLocaleString(), x0 + bw + 5, y + bh - 3,
          r.reliable ? COL.good : COL.bad);
  });
  // the floor
  const fx = x0 + (W.ess_min / maxE) * (x1 - x0);
  ctx.strokeStyle = COL.bad; ctx.setLineDash([3,3]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(fx, pad.t - 6); ctx.lineTo(fx, h - pad.b + 2); ctx.stroke();
  ctx.setLineDash([]);
  label(ctx, "floor " + W.ess_min, Math.min(fx + 4, w - 60), pad.t - 3, COL.bad);
  label(ctx, "effective sample size", 2, h - 3, COL.dimmer);
}

function drawWeightsTable(W){
  const tb = $("t-weights").querySelector("tbody");
  tb.innerHTML = '<tr><th>archetype</th><th class="r">P(fail)</th><th class="r">ESS</th>'
               + '<th class="r">ESS/n</th><th class="r">top-50 share</th></tr>';
  W.rows.forEach(r => {
    const tr = document.createElement("tr");
    if(!r.reliable) tr.className = "bad";
    const top50 = (r.concentration.find(c => c.k === 50) || {}).share;
    tr.innerHTML =
      "<td>" + r.name.replace(/_/g," ") + "</td>" +
      '<td class="r">' + (r.reliable ? (100*r.p_fail).toFixed(1) + "%"
                                     : '<span class="gated">withheld</span>') + "</td>" +
      '<td class="r">' + Math.round(r.ess).toLocaleString() + "</td>" +
      '<td class="r">' + (100*r.ess_frac).toFixed(0) + "%</td>" +
      '<td class="r">' + (top50 !== undefined ? (100*top50).toFixed(1) + "%" : "—") + "</td>";
    tb.appendChild(tr);
  });
}

// -------------------------------------------------------------------- bandit
function drawBandit(B){
  $("ctx-chips").innerHTML = B.features.map((f, i) =>
    '<span class="chip">' + f + " <b style='color:var(--accent)'>"
    + B.context[i].toFixed(2) + "</b></span>").join("")
    + '<span class="chip">alpha ' + B.alpha + "</span>"
    + '<span class="chip">' + B.t.toLocaleString() + " pulls</span>";

  // UCB decomposition
  {
    const {ctx, w, h} = prep($("c-ucb"), 170);
    const arms = B.arms.slice().sort((a,b) => b.ucb - a.ucb);
    const pad = {l: 150, r: 46, t: 14, b: 14};
    const maxU = Math.max(0.01, ...arms.map(a => a.ucb));
    const x0 = pad.l, x1 = w - pad.r;
    const bh = (h - pad.t - pad.b) / arms.length - 8;
    arms.forEach((a, i) => {
      const y = pad.t + i*(bh+8);
      const mw = Math.max(0, (a.mean/maxU)*(x1-x0));
      const bw = Math.max(0, (a.bonus/maxU)*(x1-x0));
      ctx.fillStyle = i===0 ? "rgba(61,220,151,.75)" : "rgba(74,168,224,.7)";
      ctx.fillRect(x0, y, mw, bh);
      ctx.fillStyle = i===0 ? "rgba(61,220,151,.26)" : "rgba(74,168,224,.26)";
      ctx.fillRect(x0+mw, y, bw, bh);
      label(ctx, a.name, 2, y+bh-3, i===0 ? COL.good : COL.dim);
      label(ctx, a.ucb.toFixed(3), x0+mw+bw+5, y+bh-3, COL.dim);
    });
    label(ctx, "solid = θ·x (value)   faint = α√(xᵀA⁻¹x) (uncertainty)", x0, h-2, COL.dimmer);
    $("n-ucb").innerHTML =
      "LinUCB picks the longest bar. The faint segment is the exploration bonus — it "
      + "shrinks as an arm is pulled, which is why a barely-tried arm still gets a turn. "
      + "This is the one-step case of RL: one decision, one reward, no state transition.";
  }

  // theta heat bars
  {
    const {ctx, w, h} = prep($("c-theta"), 170);
    const arms = B.arms;
    const pad = {l: 150, r: 10, t: 22, b: 14};
    const cells = B.features.length;
    const cw = (w - pad.l - pad.r) / cells;
    const bh = (h - pad.t - pad.b) / arms.length - 6;
    let mx = 0.01;
    arms.forEach(a => a.contribution.forEach(v => mx = Math.max(mx, Math.abs(v))));
    B.features.forEach((f, j) =>
      label(ctx, f.slice(0, 9), pad.l + j*cw + 1, pad.t - 6, COL.dimmer));
    arms.forEach((a, i) => {
      const y = pad.t + i*(bh+6);
      label(ctx, a.name, 2, y+bh-3, COL.dim);
      a.contribution.forEach((v, j) => {
        const t = Math.abs(v)/mx;
        ctx.fillStyle = v >= 0 ? "rgba(61,220,151," + (0.12+0.78*t) + ")"
                               : "rgba(224,87,74," + (0.12+0.78*t) + ")";
        ctx.fillRect(pad.l + j*cw, y, cw-2, bh);
      });
    });
    $("n-theta").innerHTML =
      "Per-feature contribution to each arm's predicted value, θᵢ·xᵢ. Green helps, red "
      + "hurts. This is the whole model — five numbers per arm — which is why it can be "
      + "read off the screen rather than taken on trust.";
  }

  // reward history
  {
    const {ctx, w, h} = prep($("c-reward"), 90);
    const R = B.reward_history;
    const pad = {l: 30, r: 10, t: 10, b: 14};
    const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
    ctx.strokeStyle = COL.line;
    [0, 0.5, 1].forEach(g => { const y = y0 - g*(y0-y1);
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); });
    if(R.length > 1){
      ctx.strokeStyle = COL.violet; ctx.lineWidth = 1.6;
      ctx.beginPath();
      R.forEach((v,i) => {
        const x = x0 + i/(R.length-1)*(x1-x0), y = y0 - v*(y0-y1);
        i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
      });
      ctx.stroke();
    }
    axes(ctx, w, h, pad);
    label(ctx, "1", 6, y1+4); label(ctx, "0", 6, y0+3);
    label(ctx, "reward per pull (last " + R.length + ")", x0+4, y1+4, COL.dimmer);
    $("n-reward").innerHTML =
      "Reward is <b>1 − time penalty</b> when the surrogate says the attempt succeeded "
      + "and 0 when it failed. Rolling mean <b>" + B.rolling_reward.toFixed(3) + "</b>.";
  }
}

// ----------------------------------------------------------------------- CEM
function drawCem(cem){
  if(!cem){
    $("cem-body").innerHTML =
      '<div class="empty">no search run yet — hit "Run search" on the demo page</div>';
    return;
  }
  {
    const {ctx, w, h} = prep($("c-cem"), 170);
    const V = cem.iterations, pad = {l: 34, r: 12, t: 14, b: 24};
    const x0 = pad.l, x1 = w-pad.r, y0 = h-pad.b, y1 = pad.t;
    ctx.strokeStyle = COL.line;
    [0,0.5,1].forEach(g => { const y = y0-g*(y0-y1);
      ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke(); });
    const sx = (i) => x0 + (V.length>1 ? i/(V.length-1) : 0.5)*(x1-x0);
    const sy = (v) => y0 - v*(y0-y1);
    ctx.strokeStyle = COL.bad; ctx.lineWidth = 2.2;
    ctx.beginPath();
    V.forEach((v,i) => i ? ctx.lineTo(sx(i), sy(v)) : ctx.moveTo(sx(i), sy(v)));
    ctx.stroke();
    ctx.fillStyle = COL.bad;
    V.forEach((v,i) => { ctx.beginPath(); ctx.arc(sx(i), sy(v), 3, 0, 7); ctx.fill();
      label(ctx, (100*v).toFixed(0)+"%", sx(i)-8, sy(v)-8, COL.bad); });
    axes(ctx, w, h, pad);
    label(ctx, "100%", 2, y1+4); label(ctx, "0", 2, y0+3);
    label(ctx, "iteration →", (x0+x1)/2-24, y0+20);
    $("n-cem").innerHTML =
      "Failure rate found per iteration: <b>" + (100*V[0]).toFixed(0) + "% → "
      + (100*V[V.length-1]).toFixed(0) + "%</b> over " + cem.iters + " iterations of "
      + cem.batch + " samples, in " + cem.elapsed_ms.toFixed(0) + " ms.";
  }
  {
    const {ctx, w, h} = prep($("c-cemparams"), 170);
    const a = cem.start_proposal, f = cem.final_proposal;
    const keys = ["move_sigma","remove_p","light_mean","light_sigma","clutter_lambda"];
    const pad = {l: 108, r: 96, t: 16, b: 14};
    const x0 = pad.l, x1 = w-pad.r;
    const bh = (h-pad.t-pad.b)/keys.length - 7;
    keys.forEach((k, i) => {
      const y = pad.t + i*(bh+7);
      const mx = Math.max(a[k], f[k], 1e-6);
      ctx.fillStyle = "rgba(139,149,165,.42)";
      ctx.fillRect(x0, y, (a[k]/mx)*(x1-x0), bh/2 - 1);
      ctx.fillStyle = "rgba(224,87,74,.75)";
      ctx.fillRect(x0, y + bh/2, (f[k]/mx)*(x1-x0), bh/2 - 1);
      label(ctx, k, 2, y+bh-3, COL.dim);
      label(ctx, a[k].toFixed(2) + " → " + f[k].toFixed(2), x1+4, y+bh-3, COL.dimmer);
    });
    label(ctx, "grey = start   red = converged", x0, h-2, COL.dimmer);
    $("n-cemparams").innerHTML =
      "The proposal's own parameters, before and after. It drove <b>light_mean "
      + a.light_mean.toFixed(2) + " → " + f.light_mean.toFixed(2) + "</b>: nobody told "
      + "the search that darkness breaks this room, it found that out. Severity is "
      + "penalised by implausibility, so these stay failures that could actually happen.";
  }
}

// ------------------------------------------------------------------- assemble
function render(d){
  DATA = d;
  const main = $("main");
  if(!d.has_campaign){
    main.innerHTML = '<div class="empty">no campaign yet — run one on '
      + '<a href="/">the demo page</a>, then refresh</div>';
    return;
  }
  if(!main.dataset.built){
    main.innerHTML = "";
    main.appendChild($("tpl").content.cloneNode(true));
    main.dataset.built = "1";
  }
  const p = d.pipeline;
  $("b-samples").innerHTML = "scored <b>" + p.scored.toLocaleString() + "</b>";
  $("b-seed").innerHTML = "seed <b>" + p.seed + "</b> · " + p.strategy;
  if(d.readiness){
    const st = d.readiness.state;
    $("b-ready").innerHTML = "readiness <b>" + d.readiness.score + " " + st + "</b>";
    $("b-ready").className = "badge " + (st === "READY" ? "good" : st === "NOT READY" ? "bad" : "");
  }
  drawFlow(d);
  drawSeverity(d.monte_carlo);
  drawConvergence(d.monte_carlo);
  drawScatter(d.monte_carlo, d.scene);
  drawAxesPanel(d.monte_carlo);
  drawLogW(d.weights); drawESS(d.weights); drawWeightsTable(d.weights);
  if(d.bandit) drawBandit(d.bandit);
  drawCem(d.cem);
}

async function load(){
  try{
    const r = await fetch("/api/internals");
    render(await r.json());
  }catch(e){
    $("main").innerHTML = '<div class="empty">could not load internals: ' + e + "</div>";
  }
}
$("btn-refresh").onclick = load;
let rt; window.addEventListener("resize", () => {
  clearTimeout(rt); rt = setTimeout(() => { if(DATA) render(DATA); }, 150);
});
load();
setInterval(load, 4000);   // the bandit is live; keep up with it
</script>
